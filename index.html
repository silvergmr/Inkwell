async function delNote(id){S.del('n_'+id);meta=meta.filter(m=>m.id!==id);persist();if(cur&&cur.id===id){cur=null;await openLatest()}renderList();toast('Note deleted')}
async function out(m,share){if(cur&&m.id===cur.id)save();const b=J('n_'+m.id,{}),ps=b.pages||[b],pt=ps.map(p=>plain(p.html)).join('\n\n');
const h=`<!doctype html><meta charset="utf-8"><title>${esc(m.title)}</title><body style="font-family:sans-serif;max-width:800px;margin:auto;padding:16px"><h1>${esc(m.title)}</h1>${ps.map(p=>`<div style="position:relative;min-height:600px;page-break-after:always;white-space:pre-wrap">${p.html||''}${p.draw?`<img src="${p.draw}" style="position:absolute;left:0;top:0;width:100%;height:100%">`:''}${(p.items||[]).filter(i=>i.k==='img').map(i=>`<img src="${b.files[i.id]}" style="max-width:100%;display:block;margin:12px 0">`).join('')}</div>`).join('')}`;
const f=new File([h],(m.title.replace(/[^\w\- ]/g,'')||'note')+'.html',{type:'text/html'});
if(share){try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:m.title});else if(navigator.share)await navigator.share({title:m.title,text:pt});else throw 0}catch(e){if(e&&e.name==='AbortError')return;try{await navigator.clipboard.writeText(pt);toast('Note text copied')}catch(_){toast('Sharing isn’t available here')}}}
else{const u=URL.createObjectURL(f),a=E('a');a.href=u;a.download=f.name;document.body.append(a);a.click();a.remove();toast('Exported '+f.name)}}

sheet(`<h3>Settings</h3>
<div class="row"><span>Theme</span>${sg('theme',[['auto','Auto'],['light','Light'],['dark','Dark']])}</div>
<div class="row"><span>App color</span><div class="sw">${AC.map(c=>`<button class="c${c===cfg.acc?' on':''}" data-k="acc" data-v="${c}" style="background:${c}"></button>`).join('')}</div></div>
<div class="row"><span>Autosave</span>${sg('save',[[500,'Fast'],[2000,'2 sec'],[5000,'5 sec']])}</div>
<div class="row"><span>Paper</span>${sg('paper',[['blank','Blank'],['lined','Lined'],['grid','Grid']])}</div>
<div class="row"><span>Text font</span>${sg('font',[['sans','Sans'],['serif','Serif'],['mono','Mono']])}</div>

<button class="act danger" data-a="da">${ic('trash')}Delete all notes</button>
<div class="lb">Stored on this device · ${(kb/1024).toFixed(0)} KB used of about 5 MB</div>`);sh.scrollTop=y;
sh.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const v=b.dataset.v;cfg[b.dataset.k]=v==='true'?true:v==='false'?false:(v!==''&&!isNaN(v)?+v:v);applyCfg();saveCfg();settings()});

(async()=>{applyCfg();renderTP();await openLatest();await new Promise(r=>setTimeout(r,900));$('#sp').classList.add('out')})();
