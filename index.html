<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Inkwell Notes</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
:root{--bg:#f3f2f9;--sf:#fff;--tx:#1a1a26;--mt:#7b7a92;--ln:#e5e4f0;--ac:#6d5efc;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-t=dark]{--bg:#0e0e15;--sf:#191923;--tx:#ececf5;--mt:#8d8ca3;--ln:#2a2a39;color-scheme:dark}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{width:22px;height:22px;display:block}
#sp{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s}
#sp.out{opacity:0;pointer-events:none}
.lg{width:84px;height:84px;border-radius:28px;background:linear-gradient(145deg,var(--ac),#b06bff);color:#fff;display:grid;place-items:center;box-shadow:0 14px 40px rgba(109,94,252,.4)}
.lg svg{width:40px;height:40px}
#sp h1{margin:0;font-size:26px;letter-spacing:-.5px}
.ld{width:90px;height:4px;border-radius:2px;background:var(--ln);overflow:hidden}
.ld i{display:block;height:100%;width:40%;background:var(--ac);border-radius:2px;animation:ld 1s ease-in-out infinite}
@keyframes ld{0%{margin-left:-40%}100%{margin-left:100%}}
#top{display:flex;align-items:center;gap:6px;padding:8px 10px}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.ib:active{background:var(--ln)}
#ttl{flex:1;min-width:0;display:flex;align-items:center;gap:9px;font-weight:650;font-size:16px;padding:8px 6px;border-radius:12px}
#ttl span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dot{width:10px;height:10px;border-radius:50%;background:var(--ac);flex:none}
#st{font-size:12px;color:var(--mt);padding-right:6px}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none}
#page{position:absolute;left:0;top:0;width:794px;height:1123px;transform-origin:0 0;background:#fff;border-radius:6px;box-shadow:0 10px 40px rgba(30,20,80,.2);color:#1a1a26;overflow:hidden}
#page.sm{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
#page::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--nc,var(--ac));z-index:4}
#page[data-p=lined]{background-image:linear-gradient(transparent calc(var(--lh) - 1px),#dcdaec 0);background-size:100% var(--lh);background-position:0 48px}
#page[data-p=grid]{background-image:linear-gradient(#e4e2f0 1px,transparent 1px),linear-gradient(90deg,#e4e2f0 1px,transparent 1px);background-size:28px 28px}
#txt{position:absolute;inset:0;padding:48px 56px;outline:0;white-space:pre-wrap;word-break:break-word;line-height:var(--lh);user-select:text;-webkit-user-select:text}
#txt:empty::before{content:"Start typing, or pick the pen to draw";color:#b4b3c6}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#ig{position:absolute;inset:0;pointer-events:none}
[data-m=draw] #txt,[data-m=erase] #txt{pointer-events:none}
.it{position:absolute;pointer-events:none;transform-origin:center}
[data-m=text] .it,[data-m=lasso] .it{pointer-events:auto}
.it img{width:100%;display:block;border-radius:8px;pointer-events:none}
.it.file{display:flex;align-items:center;gap:12px;padding:10px 18px 10px 10px;min-width:170px;max-width:300px;border-radius:20px;background:#f1f0fb;border:1px solid #dcdaf0}
.bd{width:42px;height:42px;border-radius:14px;background:var(--ac);color:#fff;display:grid;place-items:center;flex:none}
.it.file b,.it.file small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.it.file small{color:#7b7a92;font-size:12px}
.x,.rs{display:none;position:absolute}
[data-m=text] .x,[data-m=text] .rs{display:block}
.file .rs{display:none!important}
.x{top:-12px;right:-12px;width:26px;height:26px;border-radius:50%;background:#e11d48;color:#fff;font-style:normal;text-align:center;line-height:26px;font-size:18px}
.rs{right:-9px;bottom:-9px;width:22px;height:22px;border-radius:50%;background:var(--ac);border:3px solid #fff}
#fit{position:absolute;top:10px;right:10px;background:var(--sf);box-shadow:0 2px 10px rgba(20,16,50,.18);z-index:20;border-radius:50%}
#bar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:6px;border-radius:32px;background:var(--sf);box-shadow:0 8px 28px rgba(20,16,50,.25),0 0 0 1px var(--ln);z-index:20}
.tb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--mt);transition:background .15s,color .15s}
.tb.on{background:var(--ac);color:#fff}
.tb:disabled{opacity:.28}
.dv{width:1px;height:24px;background:var(--ln);margin:0 4px}
#pp,#tp{display:none;position:absolute;left:50%;bottom:88px;transform:translateX(-50%);width:min(94%,360px);background:var(--sf);border-radius:26px;padding:14px 16px 6px;box-shadow:0 10px 34px rgba(20,16,50,.28),0 0 0 1px var(--ln);z-index:19}
#pp.show,#tp.show{display:block}
.slots{display:flex;gap:10px;margin-bottom:12px}
.slot{flex:1;height:44px;border-radius:14px;background:var(--bg);display:grid;place-items:center;border:2px solid transparent}
.slot.on{border-color:var(--ac)}
.slot i{display:block;border-radius:50%}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.c{width:30px;height:30px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.c.on{border-color:var(--tx)}
.pick{position:relative;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);overflow:hidden}
.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.lb{display:block;font-size:13px;color:var(--mt);padding:10px 0 6px}
.lb b{color:var(--tx);float:right}
input[type=range]{width:100%;accent-color:var(--ac);margin:4px 0 6px}
.in{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;outline:0;user-select:text;-webkit-user-select:text}
.scr{position:fixed;inset:0;background:rgba(10,8,25,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:39}
.scr.on{opacity:1;pointer-events:auto}
#sc{z-index:60}
#dr{position:fixed;left:0;top:0;bottom:0;width:max(290px,50vw);padding-top:env(safe-area-inset-top,0px);background:var(--sf);z-index:40;transform:translateX(-103%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:8px 0 40px rgba(10,8,25,.25)}
#dr.open{transform:none}
.dh{display:flex;align-items:center;gap:4px;padding:12px 10px 8px 16px}
.dh h2{flex:1;margin:0;font-size:22px;letter-spacing:-.4px}
.pri{background:var(--ac);color:#fff}
#dr .in{width:calc(100% - 24px);margin:4px 12px 8px}
#L{flex:1;overflow:auto;padding-bottom:20px}
.ni{display:flex;align-items:center;gap:10px;padding:10px 4px 10px 12px;margin:2px 8px;border-radius:16px}
.ni.on{background:var(--bg)}
.cb{width:5px;align-self:stretch;border-radius:3px;flex:none}
.nt{flex:1;min-width:0}
.nt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.nt small{color:var(--mt)}
.mb{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--mt)}
.empty{text-align:center;color:var(--mt);padding:30px 16px}
#sh{position:fixed;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--sf);border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));z-index:61;transform:translateY(106%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sh.open{transform:none}
#sh h3{margin:0 0 14px;font-size:19px}
.row{padding:12px 0;border-bottom:1px solid var(--ln)}
.row>span{display:block;margin-bottom:8px;font-weight:600}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:3px}
.seg button{flex:1;padding:8px 6px;border-radius:11px;font-size:13px;color:var(--mt)}
.seg .on{background:var(--ac);color:#fff}
.act{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;text-align:left}
.danger{color:#e11d48}
.two{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;padding:13px;border-radius:16px;background:var(--bg);font-weight:600}
.btn.dng{background:#e11d48;color:#fff}
#ts{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(10px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;white-space:nowrap}
#ts.on{opacity:1;transform:translateX(-50%)}
#tp{padding-bottom:14px}
.fr{display:flex;align-items:center;gap:4px;margin-bottom:12px}
.fb{min-width:44px;height:42px;border-radius:12px;background:var(--bg);font-size:17px}
#fz{min-width:34px;text-align:center}
#pg{position:absolute;top:10px;left:10px;display:flex;align-items:center;background:var(--sf);border-radius:22px;box-shadow:0 2px 10px rgba(20,16,50,.18);z-index:20;padding:2px}
#pg button{height:38px;min-width:38px;display:grid;place-items:center;border-radius:19px;font-weight:600;font-size:14px;padding:0 4px}
#pg button:disabled{opacity:.3}
.ib:disabled{opacity:.3}
#bgl{position:absolute;inset:0;background-size:cover;background-position:center}
#bar,#pp,#tp{background:color-mix(in srgb,var(--sf) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.tb{display:flex;align-items:center;justify-content:center;gap:8px;width:auto;min-width:46px;padding:0}
.tb.on{padding:0 16px 0 14px}
.tb i{display:block;font-style:normal}
.tb .l{display:none;font-size:14px;font-weight:650}
.tb.on .l{display:inline}
#pp,#tp{border-radius:30px;padding:18px 18px 8px;bottom:92px}
.slot{height:54px;border-radius:18px}
.c{width:34px;height:34px}
#sel{display:none;position:absolute;z-index:6;border:calc(var(--z,1)*2px) solid var(--ac);border-radius:4px;background:rgba(109,94,252,.07)}
.hh{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-style:normal;font-size:17px;box-shadow:0 2px 8px rgba(0,0,0,.3);border:2px solid #fff}
.hr{left:50%;top:0;transform:translate(-50%,calc(var(--z,1)*-40px - 50%)) scale(var(--z,1))}
.hs{right:0;bottom:0;transform:translate(50%,50%) scale(var(--z,1))}
.hx{right:0;top:0;transform:translate(50%,-50%) scale(var(--z,1));background:#e11d48}
.hk{left:0;top:0;transform:translate(-50%,-50%) scale(var(--z,1));display:none}
.hp{position:absolute;left:50%;top:100%;transform:translate(-50%,calc(var(--z,1)*12px)) scale(var(--z,1));transform-origin:50% 0;background:var(--ac);color:#fff;padding:7px 18px;border-radius:16px;font-size:14px;white-space:nowrap;display:none}
#sel[data-k=fl] .hk{display:grid}
#sel[data-k=file] .hp{display:block}
#page{overflow:visible}
#ig,#ig0{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#bgl{border-radius:6px}
#st{display:none}
#top .ib{width:38px;height:38px}
#pg{position:static;box-shadow:none;background:var(--bg);padding:1px}
#pg button{height:34px;min-width:32px}
.it.file{background:var(--chip,#2b2a40);color:var(--chipt,#fff);border-color:rgba(128,128,160,.4)}
.it.file small{color:inherit;opacity:.65}
.pl{display:block;font-size:11px;opacity:.7;padding:4px 2px}
.it pre{margin:0;padding:12px;background:var(--chip,#2b2a40);color:var(--chipt,#fff);border-radius:12px;font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap;max-height:170px;overflow:hidden}
.it video,.it audio{width:100%;display:block;border-radius:10px;pointer-events:none}
.hp{display:none;gap:2px;padding:4px}
.hp b{padding:6px 12px;border-radius:12px;font-weight:600}
#sel[data-k=img] .hp,#sel[data-k=file] .hp{display:flex}
#sel:not([data-k=file]) [data-h=o],#sel[data-nopv] [data-h=m],#sel:not([data-pk=aud]):not([data-pk=vid]) [data-h=p]{display:none}
.fonts{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.fc{flex:none;padding:8px 14px;border-radius:12px;background:var(--bg);font-size:15px}
.th{display:flex;gap:10px;overflow-x:auto;padding:4px 0 12px}
.tn{flex:none;text-align:center;font-size:12px;color:var(--mt)}
.tn canvas{display:block;width:72px;height:102px;border-radius:8px;border:2px solid var(--ln);background:#fff}
.tn.on canvas{border-color:var(--ac)}
.tn.add{width:72px;height:102px;border-radius:8px;border:2px dashed var(--ln);display:grid;place-items:center;font-size:26px}

:root[data-g="1"]{--bg:rgba(255,255,255,.3);--sf:rgba(255,255,255,.34);--ln:rgba(255,255,255,.5)}
:root[data-g="1"][data-t=dark]{--bg:rgba(255,255,255,.07);--sf:rgba(40,40,64,.4);--ln:rgba(255,255,255,.16)}
:root[data-g="1"] body{background:radial-gradient(60% 42% at 12% 8%,color-mix(in srgb,var(--ac) 60%,transparent),transparent 72%),radial-gradient(52% 40% at 95% 28%,rgba(255,122,198,.55),transparent 72%),radial-gradient(64% 50% at 25% 98%,rgba(79,209,255,.55),transparent 72%),radial-gradient(40% 30% at 85% 85%,rgba(255,190,90,.4),transparent 70%),#eceefb;background-attachment:fixed}
:root[data-g="1"][data-t=dark] body{background:radial-gradient(60% 42% at 12% 8%,color-mix(in srgb,var(--ac) 55%,transparent),transparent 72%),radial-gradient(52% 40% at 95% 28%,rgba(220,60,160,.4),transparent 72%),radial-gradient(64% 50% at 25% 98%,rgba(30,140,220,.4),transparent 72%),#0a0a14;background-attachment:fixed}
:root[data-g="1"] :is(#bar,#pp,#tp,#pg,#fit,#dr,#sh,#ts,.slot,.fc,.seg,.in){backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%)}
:root[data-g="1"] :is(#bar,#pp,#tp,#pg,#fit,#dr,#sh,#ts){background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.14) 55%,rgba(255,255,255,.3));border:1px solid rgba(255,255,255,.6);box-shadow:0 12px 38px rgba(30,20,90,.22),inset 0 1.5px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.25)}
:root[data-g="1"][data-t=dark] :is(#bar,#pp,#tp,#pg,#fit,#dr,#sh,#ts){background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.04) 55%,rgba(255,255,255,.1));border-color:rgba(255,255,255,.22);box-shadow:0 12px 38px rgba(0,0,0,.5),inset 0 1.5px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.06)}
:root[data-g="1"] #ts{color:var(--tx)}
:root[data-g="1"] #pg{border-radius:22px}
:root[data-g="1"] :is(.tb.on,.pri,.seg .on){background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 78%,#fff),var(--ac));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.65),0 4px 14px color-mix(in srgb,var(--ac) 50%,transparent)}
:root[data-g="1"] .ni.on,:root[data-g="1"] .slot,:root[data-g="1"] .fc{border:1px solid rgba(255,255,255,.4)}
:root[data-g="1"] #page{box-shadow:0 20px 56px rgba(30,20,90,.32),0 0 0 1px rgba(255,255,255,.55)}
:root[data-g="1"] .scr{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
</style><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#6d5efc"></head><body>
<div id="sp"><div class="lg" data-i="pen"></div><h1>Inkwell</h1><div class="ld"><i></i></div></div>
<header id="top"><button class="ib" id="mn" data-i="menu" aria-label="Notes"></button><button id="ttl"><span id="dot"></span><span id="ttx"></span></button><span id="st"></span><div id="pg"><button id="pv" data-i="prev" aria-label="Previous page"></button><button id="pl">1 / 1</button><button id="pn" data-i="next" aria-label="Next page"></button></div><button class="ib" id="un" data-i="undo" aria-label="Undo"></button><button class="ib" id="re" data-i="redo" aria-label="Redo"></button></header>
<main id="stage">
<div id="page" data-m="text"><div id="bgl"></div><div id="ig0"></div><div id="txt" contenteditable="true" spellcheck="false"></div><div id="ig"></div><canvas id="cv"></canvas><canvas id="lv"></canvas><div id="sel"><i class="hh hr" data-h="r">↻</i><i class="hh hs" data-h="s">⤢</i><i class="hh hx" data-h="x">×</i><i class="hh hk" data-h="k">✓</i><div class="hp"><b data-h="u">▲</b><b data-h="d">▼</b><b data-h="p">Play</b><b data-h="m" id="pm">Preview</b><b data-h="o">Open</b></div></div></div>
<button class="ib" id="fit" data-i="fit" aria-label="Fit page"></button>
<div id="pp"></div><div id="tp"></div>
<nav id="bar">
<button class="tb" data-m="draw"><i data-i="pen"></i><span class="l">Draw</span></button>
<button class="tb on" data-m="text"><i data-i="text"></i><span class="l">Text</span></button>
<button class="tb" data-m="erase"><i data-i="eraser"></i><span class="l">Erase</span></button>
<button class="tb" data-m="lasso"><i data-i="lasso"></i><span class="l">Lasso</span></button>
<span class="dv"></span>
<button class="tb" id="at" aria-label="Insert file"><i data-i="clip"></i></button>
</nav>
</main>
<aside id="dr"><div class="dh"><h2>Notes</h2><button class="ib" id="gs" data-i="gear" aria-label="Settings"></button><button class="ib pri" id="nn" data-i="plus" aria-label="New note"></button></div><input id="q" class="in" placeholder="Search notes"><div id="L"></div></aside>
<div class="scr" id="ds"></div><div class="scr" id="sc"></div><div id="sh"></div><div id="ts"></div>
<input type="file" id="fi" multiple hidden><input type="file" id="fb" accept="image/*" hidden><input type="file" id="ff" accept=".ttf,.otf,.woff,.woff2" hidden>
<script>
const $=s=>document.querySelector(s),root=document.documentElement;

if(share){try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:m.title});else if(navigator.share)await navigator.share({title:m.title,text:pt});else throw 0}catch(e){if(e&&e.name==='AbortError')return;try{await navigator.clipboard.writeText(pt);toast('Note text copied')}catch(_){toast('Sharing isn’t available here')}}}
else{const u=URL.createObjectURL(f),a=E('a');a.href=u;a.download=f.name;document.body.append(a);a.click();a.remove();toast('Exported '+f.name)}}
function settings(){const y=sh.scrollTop,sg=(k,o)=>`<div class="seg">${o.map(([v,l])=>`<button data-k="${k}" data-v="${v}" class="${String(cfg[k])===String(v)?'on':''}">${l}</button>`).join('')}</div>`;
let kb=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^(n_|nb_)/.test(k))kb+=localStorage.getItem(k).length}}catch(e){}
sheet(`<h3>Settings</h3>
<div class="row"><span>Theme</span>${sg('theme',[['auto','Auto'],['light','Light'],['dark','Dark']])}</div>
<div class="row"><span>Style</span>${sg('glass',[[false,'Standard'],[true,'Liquid glass']])}</div>
<div class="row"><span>App color</span><div class="sw">${AC.map(c=>`<button class="c${c===cfg.acc?' on':''}" data-k="acc" data-v="${c}" style="background:${c}"></button>`).join('')}</div></div>
<div class="row"><span>Autosave</span>${sg('save',[[500,'Fast'],[2000,'2 sec'],[5000,'5 sec']])}</div>
<div class="row"><span>Paper</span>${sg('paper',[['blank','Blank'],['lined','Lined'],['grid','Grid']])}</div>
<div class="row"><span>Text font</span>${sg('font',[['sans','Sans'],['serif','Serif'],['mono','Mono']])}</div>
<div class="row"><span>Text size</span><input type="range" id="fs" min="14" max="34" value="${cfg.fs}"></div>
<div class="row"><span>Drawing input</span>${sg('stylus',[[false,'Finger + pen'],[true,'Pen only']])}</div>
<button class="act" data-a="rp">Reset pen slots</button>
<button class="act danger" data-a="da">${ic('trash')}Delete all notes</button>
<div class="lb">Stored on this device · ${(kb/1024).toFixed(0)} KB used of about 5 MB</div>`);sh.scrollTop=y;
sh.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const v=b.dataset.v;cfg[b.dataset.k]=v==='true'?true:v==='false'?false:(v!==''&&!isNaN(v)?+v:v);applyCfg();saveCfg();settings()});
$('#fs').oninput=e=>{cfg.fs=+e.target.value;applyCfg();saveCfg()};
sh.querySelector('[data-a=rp]').onclick=()=>{cfg.pens=JSON.parse(JSON.stringify(DS.pens));cfg.slot=0;saveCfg();toast('Pen slots reset')};
sh.querySelector('[data-a=da]').onclick=()=>ask('Delete all notes?','Delete all',async()=>{meta.forEach(m=>S.del('n_'+m.id));meta=[];persist();cur=null;await openLatest();toast('All notes deleted')})}
/* ---------- start ---------- */
(async()=>{applyCfg();await loadFonts();renderTP();await openLatest();await new Promise(r=>setTimeout(r,900));$('#sp').classList.add('out')})();
</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')</script></body></html>
