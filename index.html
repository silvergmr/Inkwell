<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Inkwell Notes</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
:root{--bg:#f3f2f9;--sf:#fff;--tx:#1a1a26;--mt:#7b7a92;--ln:#e5e4f0;--ac:#6d5efc;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-t=dark]{--bg:#0e0e15;--sf:#191923;--tx:#ececf5;--mt:#8d8ca3;--ln:#2a2a39;color-scheme:dark}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{width:22px;height:22px;display:block}
#sp{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s}
#sp.out{opacity:0;pointer-events:none}
.lg{width:84px;height:84px;border-radius:28px;background:linear-gradient(145deg,var(--ac),#b06bff);color:#fff;display:grid;place-items:center;box-shadow:0 14px 40px rgba(109,94,252,.4)}
.lg svg{width:40px;height:40px}
#sp h1{margin:0;font-size:26px;letter-spacing:-.5px}
.ld{width:90px;height:4px;border-radius:2px;background:var(--ln);overflow:hidden}
.ld i{display:block;height:100%;width:40%;background:var(--ac);border-radius:2px;animation:ld 1s ease-in-out infinite}
@keyframes ld{0%{margin-left:-40%}100%{margin-left:100%}}
#top{display:flex;align-items:center;gap:6px;padding:8px 10px}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.ib:active{background:var(--ln)}
#ttl{flex:1;min-width:0;display:flex;align-items:center;gap:9px;font-weight:650;font-size:16px;padding:8px 6px;border-radius:12px}
#ttl span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dot{width:10px;height:10px;border-radius:50%;background:var(--ac);flex:none}
#st{font-size:12px;color:var(--mt);padding-right:6px}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none}
#page{position:absolute;left:0;top:0;width:794px;height:1123px;transform-origin:0 0;background:#fff;border-radius:6px;box-shadow:0 10px 40px rgba(30,20,80,.2);color:#1a1a26;overflow:hidden}
#page.sm{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
#page::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--nc,var(--ac));z-index:4}
#page[data-p=lined]{background-image:linear-gradient(transparent calc(var(--lh) - 1px),#dcdaec 0);background-size:100% var(--lh);background-position:0 48px}
#page[data-p=grid]{background-image:linear-gradient(#e4e2f0 1px,transparent 1px),linear-gradient(90deg,#e4e2f0 1px,transparent 1px);background-size:28px 28px}
#txt{position:absolute;inset:0;padding:48px 56px;outline:0;white-space:pre-wrap;word-break:break-word;line-height:var(--lh);user-select:text;-webkit-user-select:text}
#txt:empty::before{content:"Start typing, or pick the pen to draw";color:#b4b3c6}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#ig{position:absolute;inset:0;pointer-events:none}
[data-m=draw] #txt,[data-m=erase] #txt{pointer-events:none}
.it{position:absolute;pointer-events:none}
[data-m=text] .it{pointer-events:auto}
.it img{width:100%;display:block;border-radius:8px;pointer-events:none}
.it.file{display:flex;align-items:center;gap:12px;padding:10px 18px 10px 10px;min-width:170px;max-width:300px;border-radius:20px;background:#f1f0fb;border:1px solid #dcdaf0}
.bd{width:42px;height:42px;border-radius:14px;background:var(--ac);color:#fff;display:grid;place-items:center;flex:none}
.it.file b,.it.file small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.it.file small{color:#7b7a92;font-size:12px}
.x,.rs{display:none;position:absolute}
[data-m=text] .x,[data-m=text] .rs{display:block}
.file .rs{display:none!important}
.x{top:-12px;right:-12px;width:26px;height:26px;border-radius:50%;background:#e11d48;color:#fff;font-style:normal;text-align:center;line-height:26px;font-size:18px}
.rs{right:-9px;bottom:-9px;width:22px;height:22px;border-radius:50%;background:var(--ac);border:3px solid #fff}
#fit{position:absolute;top:10px;right:10px;background:var(--sf);box-shadow:0 2px 10px rgba(20,16,50,.18);z-index:20;border-radius:50%}

.tb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--mt);transition:background .15s,color .15s}
.tb.on{background:var(--ac);color:#fff}
.tb:disabled{opacity:.28}
.dv{width:1px;height:24px;background:var(--ln);margin:0 4px}
#pp,#tp{display:none;position:absolute;left:50%;bottom:88px;transform:translateX(-50%);width:min(94%,360px);background:var(--sf);border-radius:26px;padding:14px 16px 6px;box-shadow:0 10px 34px rgba(20,16,50,.28),0 0 0 1px var(--ln);z-index:19}
#pp.show,#tp.show{display:block}
.slots{display:flex;gap:10px;margin-bottom:12px}
.slot{flex:1;height:44px;border-radius:14px;background:var(--bg);display:grid;place-items:center;border:2px solid transparent}
.slot.on{border-color:var(--ac)}
.slot i{display:block;border-radius:50%}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.c{width:30px;height:30px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.c.on{border-color:var(--tx)}
.pick{position:relative;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);overflow:hidden}
.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.lb{display:block;font-size:13px;color:var(--mt);padding:10px 0 6px}
.lb b{color:var(--tx);float:right}
input[type=range]{width:100%;accent-color:var(--ac);margin:4px 0 6px}
.in{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;outline:0;user-select:text;-webkit-user-select:text}
.scr{position:fixed;inset:0;background:rgba(10,8,25,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:39}
.scr.on{opacity:1;pointer-events:auto}
#sc{z-index:60}
#dr{position:fixed;left:0;top:0;bottom:0;width:max(290px,50vw);padding-top:env(safe-area-inset-top,0px);background:var(--sf);z-index:40;transform:translateX(-103%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:8px 0 40px rgba(10,8,25,.25)}
#dr.open{transform:none}
.dh{display:flex;align-items:center;gap:4px;padding:12px 10px 8px 16px}
.dh h2{flex:1;margin:0;font-size:22px;letter-spacing:-.4px}
.pri{background:var(--ac);color:#fff}
#dr .in{width:calc(100% - 24px);margin:4px 12px 8px}
#L{flex:1;overflow:auto;padding-bottom:20px}
.ni{display:flex;align-items:center;gap:10px;padding:10px 4px 10px 12px;margin:2px 8px;border-radius:16px}
.ni.on{background:var(--bg)}
.cb{width:5px;align-self:stretch;border-radius:3px;flex:none}
.nt{flex:1;min-width:0}
.nt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.nt small{color:var(--mt)}
.mb{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--mt)}
.empty{text-align:center;color:var(--mt);padding:30px 16px}
#sh{position:fixed;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--sf);border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));z-index:61;transform:translateY(106%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}

#sh h3{margin:0 0 14px;font-size:19px}
.row{padding:12px 0;border-bottom:1px solid var(--ln)}
.row>span{display:block;margin-bottom:8px;font-weight:600}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:3px}
.seg button{flex:1;padding:8px 6px;border-radius:11px;font-size:13px;color:var(--mt)}
.seg .on{background:var(--ac);color:#fff}
.act{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;text-align:left}
.danger{color:#e11d48}
.two{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;padding:13px;border-radius:16px;background:var(--bg);font-weight:600}
.btn.dng{background:#e11d48;color:#fff}
#ts{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(10px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;white-space:nowrap}
#ts.on{opacity:1;transform:translateX(-50%)}
#tp{padding-bottom:14px}
.fr{display:flex;align-items:center;gap:4px;margin-bottom:12px}
.fb{min-width:44px;height:42px;border-radius:12px;background:var(--bg);font-size:17px}
#fz{min-width:34px;text-align:center}
#pg{position:absolute;top:10px;left:10px;display:flex;align-items:center;background:var(--sf);border-radius:22px;box-shadow:0 2px 10px rgba(20,16,50,.18);z-index:20;padding:2px}
#pg button{height:38px;min-width:38px;display:grid;place-items:center;border-radius:19px;font-weight:600;font-size:14px;padding:0 4px}
#pg button:disabled{opacity:.3}
